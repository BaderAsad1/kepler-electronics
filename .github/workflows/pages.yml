name: Publish Kepler public website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kepler_test
          POSTGRES_USER: kepler_test
          POSTGRES_PASSWORD: isolated_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kepler_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://kepler_test:isolated_ci_only@localhost:5432/kepler_test
      DATABASE_URL: postgresql://kepler_test:isolated_ci_only@localhost:5432/kepler_test
      SITE_ENV: staging
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run assets:restore
      - run: npm run lint && npm run typecheck && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run db:setup && npm run migrate:import && npm run build
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run assets:restore
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run migrate:verify
        env:
          VERIFY_DATABASE: 'false'
      - run: npm run build:pages
        env:
          PAGES_BASE_PATH: /kepler-electronics
          PAGES_SITE_URL: https://baderasad1.github.io/kepler-electronics
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-app/out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, verify]
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
