name: Shopify theme validation
on:
  push:
    branches: [main, 'Bader/**']
    paths: ['shopify/**', '.github/workflows/shopify-theme.yml']
  pull_request:
    paths: ['shopify/**', '.github/workflows/shopify-theme.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopify/tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shopify/tools/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kepler-shopify-validation
          path: |
            shopify/theme/*.zip
            shopify/reports/browser-tests.json
            shopify/reports/screenshots/
